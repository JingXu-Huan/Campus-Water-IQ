spring:
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        file-extension: yml
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
        shared-configs:
          - data-id: shared-mysql-config.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-rocketmq-config.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: shared-redis-config.yml
            group: DEFAULT_GROUP
            refresh: true
          - data-id: common-service.yml
            group: DEFAULT_GROUP
            refresh: true
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: DEFAULT_GROUP
        username: ${NACOS_USERNAME:}
        password: ${NACOS_PASSWORD:}
