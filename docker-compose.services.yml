name: campus-water-services

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks:
    - campus-water
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &service-environment
    TZ: ${TZ:-Asia/Shanghai}
    NACOS_SERVER_ADDR: ${NACOS_SERVER_ADDR:-campus-water-nacos:8848}
    NACOS_NAMESPACE: ${NACOS_NAMESPACE:-}
    NACOS_USERNAME: ${NACOS_USERNAME:-}
    NACOS_PASSWORD: ${NACOS_PASSWORD:-}
    MYSQL_HOST: ${MYSQL_HOST:-mysql}
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-water}
    MYSQL_USERNAME: ${MYSQL_USERNAME:-root}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-local}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_DATABASE: ${REDIS_DATABASE:-0}
    REDIS_LOCK_HOST: ${REDIS_LOCK_HOST:-redission}
    REDIS_LOCK_PORT: ${REDIS_LOCK_PORT:-6379}
    ROCKETMQ_NAME_SERVER: ${ROCKETMQ_NAME_SERVER:-campus-water-rmq-namesrv:9876}
    INFLUX_URL: ${INFLUX_URL:-http://influxdb2:8086}
    INFLUX_TOKEN: ${INFLUX_TOKEN:-replace-with-a-random-local-token}
    INFLUX_ORG: ${INFLUX_ORG:-ncwu}
    INFLUX_BUCKET: ${INFLUX_BUCKET:-water}
    CANAL_HOST: ${CANAL_HOST:-canal-server}
    CANAL_PORT: ${CANAL_PORT:-11111}

services:
  water-gateway:
    <<: *service-defaults
    image: campus-water/water-gateway:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: water-gateway
        ARTIFACT_NAME: water-gateway
    container_name: campus-water-gateway
    ports:
      - "18080:18080"

  auth-service:
    <<: *service-defaults
    image: campus-water/auth-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: auth-service
        ARTIFACT_NAME: auth-service
    container_name: campus-water-auth-service
    environment:
      <<: *service-environment
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-local-dev}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-local-dev}
    ports:
      - "18099:18099"

  iot-device:
    <<: *service-defaults
    image: campus-water/iot-device:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: IoT-device
        ARTIFACT_NAME: IoT-device
    container_name: campus-water-iot-device
    ports:
      - "18015:18015"
      - "50052:50052"

  iot-service:
    <<: *service-defaults
    image: campus-water/iot-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: IoT-service/service
        ARTIFACT_NAME: service
    container_name: campus-water-iot-service
    depends_on:
      - iot-device
    ports:
      - "18016:18016"
      - "20881:20881"

  ingest-group:
    <<: *service-defaults
    image: campus-water/ingest-group:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: IoT-service/ingest-group
        ARTIFACT_NAME: ingest-group
    container_name: campus-water-ingest-group

  prediction-service:
    <<: *service-defaults
    image: campus-water/prediction-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: prediction-service
        ARTIFACT_NAME: prediction-service
    container_name: campus-water-prediction-service
    environment:
      <<: *service-environment
      API_KEY: ${API_KEY:-}
    ports:
      - "18017:18017"

  repair-service:
    <<: *service-defaults
    image: campus-water/repair-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: repair-service
        ARTIFACT_NAME: repair-service
    container_name: campus-water-repair-service
    environment:
      <<: *service-environment
      SPRING_AI_OPENAI_BASE_URL: ${SPRING_AI_OPENAI_BASE_URL:-http://host.docker.internal:11434}
      SPRING_AI_OPENAI_API_KEY: ${SPRING_AI_OPENAI_API_KEY:-ollama}
      SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: ${SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL:-qwen2.5:7b}
    ports:
      - "20000:20000"

  warning-service:
    <<: *service-defaults
    image: campus-water/warning-service:local
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        MODULE: warning-service
        ARTIFACT_NAME: warning-service
    container_name: campus-water-warning-service
    environment:
      <<: *service-environment
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:-}
      MANAGEMENT_HEALTH_MAIL_ENABLED: ${MANAGEMENT_HEALTH_MAIL_ENABLED:-false}
    ports:
      - "18018:18018"
      - "20888:20888"

networks:
  campus-water:
    external: true
    name: campus-water-network
